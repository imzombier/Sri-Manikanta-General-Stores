<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>Grocery Shop</title><link rel="stylesheet" href="/style.css"></head><body><header class="shophead"><h1>🛒 మా జనరల్ స్టోర్</h1><p>Grocery shopping • Fresh everyday essentials</p><nav><a href="/shop">Shop</a><a href="/admin">Admin</a></nav></header><main>
<section class="card"><input id="search" placeholder="Search products / వస్తువులు వెతకండి…"></section>
<section><h2>Available products</h2><div id="catalog" class="catalog">Loading products…</div></section>
<section class="card"><h2>Your shopping cart</h2><div id="cart">Cart is empty.</div><div class="total">Total <strong id="total">₹0.00</strong></div></section>
<section class="card"><h2>Place order</h2><label>Your name<input id="customer" placeholder="Customer name"></label><label>Mobile number<input id="phone" inputmode="numeric" placeholder="10-digit mobile number"></label><button id="placeOrder">Place order</button><p id="message" class="msg"></p></section>
</main><script src="/shop.js"></script></body></html>
