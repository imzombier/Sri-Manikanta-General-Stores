<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="head"><div><h1>Store Admin</h1><p>Products, stock and orders</p></div><a href="/shop">Open Shop ↗</a></div></header><main><section id="login" class="card login"><h2>Admin Login</h2><label>Password<input id="password" type="password"></label><button id="loginBtn">Login</button><p id="loginMsg"></p></section><div id="area" class="hidden"><div class="tabs"><button data-tab="productPanel" class="active">Products</button><button data-tab="orderPanel">Orders</button><button id="logout" class="soft">Logout</button></div><section id="productPanel" class="panel active"><div class="card"><h2 id="formTitle">Add product</h2><form id="form"><input id="pid" type="hidden"><div class="fields"><label>Name (Telugu / English)<input id="name" required placeholder="బియ్యం"></label><label>Category<input id="category"></label><label>Image URL<input id="image" type="url" placeholder="https://..."></label><label>Unit<select id="unit"><option value="kg">kg</option><option value="litre">litre</option><option value="piece">piece</option><option value="pack">pack</option></select></label><label>Purchase price ₹<input id="purchase" type="number" min="0" step=".01" required></label><label>Profit type<select id="ptype"><option value="amount">Rupees</option><option value="percent">Percentage</option></select></label><label>Profit value<input id="profit" type="number" min="0" step=".01" required></label><label>Selling price (auto)<input id="selling" readonly></label><label>Stock<input id="stock" type="number" min="0" step=".001" value="0"></label><label>Low stock alert<input id="low" type="number" min="0" step=".001" value="2"></label></div><div class="actions"><button>Save product</button><button type="button" id="clear" class="soft">Clear</button></div></form></div><div class="card"><h2>Product inventory</h2><input id="searchAdmin" placeholder="Search products"><div id="products"></div></div></section><section id="orderPanel" class="panel"><div class="card"><h2>Customer orders</h2><div id="orders"></div></div></section></div></main><script src="/admin.js"></script></body></html>
