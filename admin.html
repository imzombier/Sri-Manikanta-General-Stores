<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>Admin | General Store</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>General Store — Admin</h1><p>Private product and order management</p><nav><a href="/admin">Admin</a><a href="/shop">Customer Shop</a></nav></header><main>
<section id="login" class="card"><h2>Admin Login</h2><label>Admin password<input id="password" type="password" placeholder="Enter admin password"></label><button id="loginBtn">Login</button><p id="loginMsg" class="msg"></p></section>
<div id="adminArea" class="hidden">
<section class="card"><div class="between"><h2 id="formTitle">Add product</h2><button class="light" id="logout">Logout</button></div>
<form id="productForm"><input type="hidden" id="pid"><div class="fields">
<label>Product name (Telugu / English)<input id="name" required placeholder="బియ్యం"></label>
<label>Category<input id="category" placeholder="Groceries"></label>
<label>Purchase rate (₹ per kg/unit)<input id="purchase" type="number" min="0" step=".01" required></label>
<label>Profit type<select id="profitType"><option value="amount">Fixed rupees (₹)</option><option value="percent">Percentage (%)</option></select></label>
<label>Profit value<input id="profit" type="number" min="0" step=".01" required></label>
<label>Selling price (auto)<input id="selling" readonly></label>
<label>Available stock (kg/unit)<input id="stock" type="number" min="0" step=".001" value="0"></label>
<label>Low-stock alert<input id="low" type="number" min="0" step=".001" value="2"></label>
</div><div class="actions"><button type="submit">Save product</button><button type="button" class="light" id="clear">Clear</button></div></form></section>
<section class="card"><h2>Manage products</h2><div id="products">Loading…</div></section>
<section class="card"><h2>Customer orders</h2><div id="orders">Loading…</div></section></div>
</main><script src="/admin.js"></script></body></html>
