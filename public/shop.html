<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>Grocery Shopping</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head><body><header class="shophead"><div class="head"><div><h1>🛒 మా జనరల్ స్టోర్</h1><p>Fresh groceries for your home</p></div><button id="cartJump" class="white">Cart <b id="count">0</b></button></div></header><main><input id="search" class="searchbar" placeholder="Search groceries / వస్తువులు వెతకండి…"><div class="sectionhead"><div><h2>Shop groceries</h2><p>Select items and quantity</p></div><small id="itemCount"></small></div><div id="catalog" class="catalog">Loading products…</div><section id="cartSection" class="card"><div class="head"><div><h2>Your Cart</h2><p>Review your items</p></div><button id="continue" class="soft">＋ Continue shopping</button></div><div id="cart">Your cart is empty.</div><div class="total"><span>Total</span><b id="total">₹0.00</b></div></section><section class="card"><h2>Place your order</h2><div class="fields"><label>Name<input id="customer" placeholder="Your name"></label><label>Mobile number<input id="phone" inputmode="numeric" placeholder="10-digit mobile"></label><label class="wide">Address / Pickup note<input id="address" placeholder="Delivery address or shop pickup"></label></div><button id="order" class="full">Place order</button><p id="msg"></p></section></main><div id="modal" class="modal hidden"><div id="backdrop" class="backdrop"></div><div class="modalbox"><button id="close" class="close">×</button><img id="mimg" alt=""><h2 id="mname"></h2><p id="mcat"></p><b id="mprice" class="green"></b><label>Quantity type<select id="mode"><option value="grams">Grams</option><option value="kg">Kilograms</option><option value="rupees">Rupee amount</option><option value="units">Pieces / packs</option></select></label><label id="qtyLabel">Quantity in grams<input id="qty" type="number" min=".001" step="any" value="500"></label><div class="total">Price <b id="lineTotal">₹0.00</b></div><button id="add" class="full">Add to cart</button></div></div><script src="/shop.js"></script></body></html>
